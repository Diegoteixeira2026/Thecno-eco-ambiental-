<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thecno Eco Ambiental - Gestão</title>
<style>
:root{--verde:#087747;--escuro:#06462e;--fundo:#f1f5f9}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);font:15px Arial;color:#263238}
header{background:var(--escuro);color:white;text-align:center;padding:20px}
header h1{margin:5px;font-size:23px}
nav{background:var(--verde);padding:10px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
button{padding:11px 14px;border:0;border-radius:8px;font-weight:bold;cursor:pointer}
nav button{background:#ffffff25;color:white}
main{max-width:1100px;margin:auto;padding:15px}
section{display:none}
section.ativo{display:block}
.card{background:white;border-radius:12px;padding:18px;margin-bottom:15px;box-shadow:0 2px 8px #0001}
h2,h3{color:var(--escuro)}
label{display:block;font-weight:bold;font-size:13px;margin:10px 0 5px}
input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:7px;font-size:15px}
textarea{min-height:70px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.verde{background:var(--verde);color:white}
.azul{background:#dbeafe;color:#1e40af}
.vermelho{background:#fee2e2;color:#991b1b}
.tabela{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{border-bottom:1px solid #ddd;padding:10px;text-align:left}
th{background:#e8f5ee}
.resumo{background:#e8f5ee;padding:15px;border-radius:9px;margin-top:12px}
.acoes{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}
small{color:#64748b}
</style>
</head>
<body>
<header>
<h1>♻ THECNO ECO AMBIENTAL</h1>
<p>Gestão de Coletas • Compras • Vendas • Estoque</p>
</header>
<nav id="menu"></nav>
<main id="app"></main>
<script>
const DBKEY="thecnoeco_gestao_v1";
const padrao={
 clientes:[],compras:[],vendas:[],coletas:[],ordens:[],
 materiais:[
 {nome:"PLACA MARROM",un:"KG",grupo:"PLACAS",preco:0},
 {nome:"PLACA INTERMEDIARIA",un:"KG",grupo:"PLACAS",preco:0},
 {nome:"PLACA ALTA",un:"KG",grupo:"PLACAS",preco:0},
 {nome:"PLACA BAIXA",un:"KG",grupo:"PLACAS",preco:0},
 {nome:"ALUMINIO",un:"KG",grupo:"ALUMINIO",preco:0},
 {nome:"COBRE",un:"KG",grupo:"COBRE",preco:0},
 {nome:"FERRO",un:"KG",grupo:"OUTROS",preco:0},
 {nome:"METAL",un:"KG",grupo:"OUTROS",preco:0},
 {nome:"FONTE PC",un:"UN",grupo:"UNIDADES",preco:0},
 {nome:"TV",un:"UN",grupo:"UNIDADES",preco:0}
 ],
 precos:[],usuario:"Diego"
};
let db;
try{db={...padrao,...JSON.parse(localStorage.getItem(DBKEY)||"{}")}}
catch(e){db=structuredClone(padrao)}
let itens=[];
let tela="inicio";
const $=id=>document.getElementById(id);
const dinheiro=n=>Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const numero=n=>Number(n||0).toLocaleString("pt-BR",{maximumFractionDigits:3});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const hoje=()=>new Date().toLocaleDateString("en-CA");
function salvar(){localStorage.setItem(DBKEY,JSON.stringify(db))}
function normal(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().trim()}
function opcoes(arr,valor="id",texto="nome"){
 return arr.map(x=>`<option value="${esc(x[valor])}">${esc(x[texto])}</option>`).join("")
}
const paginas={
 inicio:"Início",clientes:"Clientes",compra:"Compras",
 venda:"Vendas",coleta:"Coletas",os:"Ordens de Serviço",
 estoque:"Estoque",precos:"Preços",relatorios:"Relatórios",
 financeiro:"Financeiro"
};
function abrir(p){
 tela=p;itens=[];render();
}
function render(){
 $("menu").innerHTML=Object.entries(paginas).map(([k,v])=>
 `<button onclick="abrir('${k}')">${v}</button>`).join("");
 const fun={
 inicio:inicio,clientes:clientes,compra:()=>movimento("compra"),
 venda:()=>movimento("venda"),coleta:coleta,os:os,
 estoque:estoque,precos:precos,relatorios:relatorios,
 financeiro:financeiro
 };
 $("app").innerHTML=fun[tela]();
}
function inicio(){
 return `<div class="card"><h2>Painel principal</h2>
 <div class="grid">
 <div class="resumo"><b>Clientes</b><h2>${db.clientes.length}</h2></div>
 <div class="resumo"><b>Compras</b><h2>${db.compras.length}</h2></div>
 <div class="resumo"><b>Vendas</b><h2>${db.vendas.length}</h2></div>
 <div class="resumo"><b>Coletas</b><h2>${db.coletas.length}</h2></div>
 </div><label>Responsável neste dispositivo</label>
 <select id="usuario" onchange="db.usuario=this.value;salvar()">
 ${["Diego","Juan","Carla"].map(n=>`<option ${db.usuario===n?"selected":""}>${n}</option>`).join("")}
 </select><p><small>Versão local de testes. Selecionar o nome não equivale a login seguro.</small></p>
 </div>`;
}
function clientes(){
 return `<div class="card"><h2>Cadastro de clientes</h2>
 <form onsubmit="cadastrarCliente(event)">
 <div class="grid">
 <div><label>Nome</label><input id="cnome" required></div>
 <div><label>Telefone</label><input id="ctel"></div>
 <div><label>PIX</label><input id="cpix"></div>
 <div><label>Cidade</label><input id="ccidade" required></div>
 <div><label>Tipologia</label><select id="ctipo">
 ${["SUCATEIRO","SAO LUIS","INTERIOR","ITAPECURU","IMPERATRIZ"].map(x=>`<option>${x}</option>`).join("")}
 </select></div>
 <div><label>Localização (link Maps)</label><input id="clocal" type="url" placeholder="https://maps.google.com/..."></div>
 </div><div class="acoes"><button class="verde">Salvar cliente</button></div>
 </form></div>
 <div class="card"><h3>Clientes cadastrados</h3><div class="tabela">
 <table><tr><th>Nome</th><th>Cidade</th><th>Telefone</th><th>Localização</th></tr>
 ${db.clientes.map(c=>`<tr><td>${esc(c.nome)}</td><td>${esc(c.cidade)}</td>
 <td>${esc(c.tel)}</td><td>${c.local?`<button class="azul" onclick="rota('${c.id}')">Abrir rota</button>`:"-"}</td></tr>`).join("")}
 </table></div></div>`;
}
function cadastrarCliente(e){
 e.preventDefault();
 db.clientes.push({id:id(),nome:normal($("cnome").value),
 tel:$("ctel").value,pix:$("cpix").value,
 cidade:normal($("ccidade").value),tipo:$("ctipo").value,
 local:$("clocal").value});
 salvar();render();alert("Cliente cadastrado!");
}
function rota(cid){
 const c=db.clientes.find(x=>x.id===cid);
 if(!c||!c.local)return alert("Cliente sem localização cadastrada.");
 try{
 const u=new URL(c.local);
 if(!["https:","http:"].includes(u.protocol))return;
 window.open(u.href,"_blank","noopener");
 }catch(e){alert("Link de localização inválido.");}
}
function seletorClientes(){
 return `<select id="cliente" required onchange="if(document.getElementById('material'))preencherPreco()"><option value="">Selecione</option>
 ${opcoes(db.clientes)}</select>`;
}
function movimento(tipo){
 return `<div class="card"><h2>${tipo==="compra"?"Nova compra":"Nova venda"}</h2>
 <label>Cliente</label>${seletorClientes()}
 <div class="grid">
 <div><label>Material</label><select id="material" onchange="preencherPreco()">
 ${db.materiais.map((m,i)=>`<option value="${i}">${esc(m.nome)} (${m.un})</option>`).join("")}
 </select></div>
 <div><label>Quantidade</label><input id="quantidade" type="number" step="0.001" min="0.001"></div>
 <div><label>Preço unitário (R$)</label><input id="valor" type="number" step="0.01" min="0"></div>
 </div>
 <div class="acoes"><button class="azul" onclick="adicionarItem()">+ Adicionar material</button></div>
 <div id="listaItens"></div>
 <label>Observações</label><textarea id="obs"></textarea>
 <div class="acoes"><button class="verde" onclick="salvarMovimento('${tipo}')">Salvar ${tipo}</button></div>
 </div>`;
}
function preencherPreco(){
 const m=db.materiais[Number($("material").value)];
 if(!m)return;
 const c=db.clientes.find(x=>x.id===$("cliente").value);
 const p=c?db.precos.find(x=>x.material===m.nome&&x.cidade===c.cidade&&x.tipo===c.tipo):null;
 $("valor").value=p?p.valor:m.preco;
}
function adicionarItem(){
 const m=db.materiais[Number($("material").value)];
 const qtd=Number($("quantidade").value),valor=Number($("valor").value);
 if(!m||!Number.isFinite(qtd)||qtd<=0||$("valor").value===""||valor<0||!Number.isFinite(valor))
 return alert("Confira quantidade e preço.");
 itens.push({nome:m.nome,grupo:m.grupo,un:m.un,qtd,valor});
 mostrarItens();
 $("quantidade").value="";
}
function mostrarItens(){
 $("listaItens").innerHTML=`<div class="tabela"><table>
 <tr><th>Material</th><th>Qtd.</th><th>Total</th><th></th></tr>
 ${itens.map((x,i)=>`<tr><td>${esc(x.nome)}</td><td>${numero(x.qtd)} ${x.un}</td>
 <td>${dinheiro(x.qtd*x.valor)}</td>
 <td><button class="vermelho" onclick="itens.splice(${i},1);mostrarItens()">X</button></td></tr>`).join("")}
 </table></div><div class="resumo">
 <b>Total: ${dinheiro(itens.reduce((s,x)=>s+x.qtd*x.valor,0))}</b><p>
 Placas: ${numero(itens.filter(x=>x.grupo==="PLACAS").reduce((s,x)=>s+x.qtd,0))} kg |
 Alumínio: ${numero(itens.filter(x=>x.grupo==="ALUMINIO").reduce((s,x)=>s+x.qtd,0))} kg |
 Cobre: ${numero(itens.filter(x=>x.grupo==="COBRE").reduce((s,x)=>s+x.qtd,0))} kg |
 Unidades: ${numero(itens.filter(x=>x.un==="UN").reduce((s,x)=>s+x.qtd,0))}
 </p></div>`;
}
function salvarMovimento(tipo){
 const cliente=$("cliente").value;
 if(!cliente||!itens.length)return alert("Selecione cliente e adicione materiais.");
 const registro={id:id(),data:new Date().toISOString(),cliente,
 responsavel:db.usuario,itens:structuredClone(itens),obs:$("obs").value,
 total:itens.reduce((s,x)=>s+x.qtd*x.valor,0)};
 db[tipo==="compra"?"compras":"vendas"].push(registro);
 salvar();itens=[];render();
 alert("Registro salvo!");
}
function coleta(){
 return `<div class="card"><h2>Nova coleta</h2>
 <label>Cliente</label>${seletorClientes()}
 <div class="grid">
 <div><label>Data</label><input id="dataColeta" type="date" value="${hoje()}"></div>
 <div><label>Horário</label><input id="horaColeta" type="time"></div>
 <div><label>Responsável</label><input id="respColeta" value="${esc(db.usuario)}"></div>
 <div><label>Status</label><select id="statusColeta">
 <option>AGENDADA</option><option>EM ANDAMENTO</option><option>CONCLUIDA</option>
 </select></div></div>
 <label>Descrição dos materiais</label><textarea id="descColeta"></textarea>
 <div class="acoes"><button class="verde" onclick="salvarColeta()">Salvar coleta</button></div>
 </div><div class="card"><h3>Coletas registradas</h3><div class="tabela"><table>
 <tr><th>Data</th><th>Cliente</th><th>Responsável</th><th>Status</th><th>Rota</th></tr>
 ${db.coletas.map(c=>`<tr><td>${esc(c.data)}</td><td>${nomeCliente(c.cliente)}</td>
 <td>${esc(c.responsavel)}</td><td>${esc(c.status)}</td>
 <td><button class="azul" onclick="rota('${c.cliente}')">Mapa</button></td></tr>`).join("")}
 </table></div></div>`;
}
function nomeCliente(cid){
 const c=db.clientes.find(x=>x.id===cid);
 return esc(c?c.nome:"Cliente não encontrado");
}
function salvarColeta(){
 if(!$("cliente").value)return alert("Selecione o cliente.");
 db.coletas.push({
 id:id(),cliente:$("cliente").value,data:$("dataColeta").value,
 hora:$("horaColeta").value,responsavel:$("respColeta").value,
 status:$("statusColeta").value,descricao:$("descColeta").value
 });
 salvar();render();alert("Coleta salva!");
}
function os(){
 return `<div class="card"><h2>Nova ordem de serviço</h2>
 <p><small>A assinatura do cliente não é obrigatória.</small></p>
 <label>Cliente</label>${seletorClientes()}
 <div class="grid">
 <div><label>Data</label><input id="osData" type="date" value="${hoje()}"></div>
 <div><label>Responsável</label><input id="osResp" value="${esc(db.usuario)}"></div>
 <div><label>Tipo de serviço</label><select id="osTipo">
 <option>COLETA</option><option>TRIAGEM</option>
 <option>DESCARACTERIZACAO</option><option>TRANSPORTE</option>
 <option>OUTRO</option></select></div>
 <div><label>Status</label><select id="osStatus">
 <option>ABERTA</option><option>EM ANDAMENTO</option>
 <option>CONCLUIDA</option><option>CANCELADA</option>
 </select></div></div>
 <label>Descrição do serviço</label><textarea id="osDesc"></textarea>
 <div class="acoes"><button class="verde" onclick="salvarOS()">Salvar OS</button></div>
 </div><div class="card"><h3>Ordens de serviço</h3><div class="tabela"><table>
 <tr><th>Número</th><th>Cliente</th><th>Serviço</th><th>Status</th><th>Ações</th></tr>
 ${db.ordens.map(o=>`<tr><td>${esc(o.numero)}</td><td>${nomeCliente(o.cliente)}</td>
 <td>${esc(o.tipo)}</td><td>${esc(o.status)}</td><td>
 <button class="azul" onclick="imprimirOS('${o.id}')">PDF</button>
 <button class="verde" onclick="concluirOS('${o.id}')">Concluir</button>
 </td></tr>`).join("")}</table></div></div>`;
}
function salvarOS(){
 if(!$("cliente").value)return alert("Selecione o cliente.");
 const seq=Number(db.proximaOS||1);
 db.ordens.push({
 id:id(),numero:"OS-"+String(seq).padStart(6,"0"),
 cliente:$("cliente").value,data:$("osData").value,
 responsavel:$("osResp").value,tipo:$("osTipo").value,
 status:$("osStatus").value,descricao:$("osDesc").value
 });
 db.proximaOS=seq+1;salvar();render();alert("OS salva!");
}
function concluirOS(oid){
 const o=db.ordens.find(x=>x.id===oid);
 if(!o)return;
 o.status="CONCLUIDA";salvar();render();
}
function imprimirOS(oid){
 const o=db.ordens.find(x=>x.id===oid);
 if(!o)return;
 imprimirDocumento(`Ordem de Serviço ${esc(o.numero)}`,
 `<p><b>Cliente:</b> ${nomeCliente(o.cliente)}</p>
 <p><b>Data:</b> ${esc(o.data)}</p>
 <p><b>Responsável:</b> ${esc(o.responsavel)}</p>
 <p><b>Serviço:</b> ${esc(o.tipo)}</p>
 <p><b>Status:</b> ${esc(o.status)}</p>
 <p><b>Descrição:</b> ${esc(o.descricao)}</p>`);
}
function estoque(){
 const saldo={};
 db.materiais.forEach(m=>saldo[m.nome]={qtd:0,un:m.un,grupo:m.grupo});
 db.compras.forEach(c=>c.itens.forEach(x=>{
 if(!saldo[x.nome])saldo[x.nome]={qtd:0,un:x.un,grupo:x.grupo};
 saldo[x.nome].qtd+=x.qtd;
 }));
 db.vendas.forEach(c=>c.itens.forEach(x=>{
 if(!saldo[x.nome])saldo[x.nome]={qtd:0,un:x.un,grupo:x.grupo};
 saldo[x.nome].qtd-=x.qtd;
 }));
 return `<div class="card"><h2>Estoque de materiais</h2>
 <p><small>Calculado pelas compras menos as vendas registradas.</small></p>
 <div class="tabela"><table>
 <tr><th>Material</th><th>Categoria</th><th>Saldo</th></tr>
 ${Object.entries(saldo).map(([n,x])=>`<tr>
 <td>${esc(n)}</td><td>${esc(x.grupo)}</td>
 <td>${numero(x.qtd)} ${esc(x.un)}</td></tr>`).join("")}
 </table></div></div>`;
}
function precos(){
 return `<div class="card"><h2>Tabela de preços</h2>
 <p>Cadastre preços por cidade e tipologia.</p>
 <div class="grid">
 <div><label>Material</label><select id="precoMaterial">
 ${db.materiais.map((m,i)=>`<option value="${i}">${esc(m.nome)}</option>`).join("")}
 </select></div>
 <div><label>Cidade</label><input id="precoCidade" placeholder="SAO LUIS"></div>
 <div><label>Tipologia</label><select id="precoTipo">
 ${["SUCATEIRO","SAO LUIS","INTERIOR","ITAPECURU","IMPERATRIZ"].map(x=>`<option>${x}</option>`).join("")}
 </select></div>
 <div><label>Preço (R$)</label><input id="precoValor" type="number" min="0" step="0.01"></div>
 </div><div class="acoes"><button class="verde" onclick="salvarPreco()">Salvar preço</button>
 <button class="azul" onclick="imprimirPrecos()">Imprimir / PDF</button></div>
 </div><div class="card"><h3>Preços cadastrados</h3>
 <div class="tabela"><table><tr><th>Material</th><th>Cidade</th><th>Tipologia</th><th>Preço</th></tr>
 ${db.precos.map(p=>`<tr><td>${esc(p.material)}</td><td>${esc(p.cidade)}</td>
 <td>${esc(p.tipo)}</td><td>${dinheiro(p.valor)}</td></tr>`).join("")}
 </table></div></div>`;
}
function salvarPreco(){
 const m=db.materiais[Number($("precoMaterial").value)];
 const cidade=normal($("precoCidade").value);
 const tipo=$("precoTipo").value;
 const valor=Number($("precoValor").value);
 if(!cidade||$("precoValor").value===""||valor<0)return alert("Preencha cidade e preço.");
 const anterior=db.precos.find(p=>p.material===m.nome&&p.cidade===cidade&&p.tipo===tipo);
 if(anterior)anterior.valor=valor;
 else db.precos.push({material:m.nome,cidade,tipo,valor});
 m.preco=valor;
 salvar();render();alert("Preço salvo!");
}
function imprimirPrecos(){
 const linhas=db.precos.map(p=>`<tr><td>${esc(p.material)}</td>
 <td>${esc(p.cidade)}</td><td>${esc(p.tipo)}</td>
 <td>${dinheiro(p.valor)}</td></tr>`).join("");
 imprimirDocumento("Tabela de Preços",
 `<table><tr><th>Material</th><th>Cidade</th><th>Tipologia</th><th>Preço</th></tr>${linhas}</table>`);
}
function relatorios(){
 const compras=db.compras.reduce((s,x)=>s+x.total,0);
 const vendas=db.vendas.reduce((s,x)=>s+x.total,0);
 const placas=db.compras.flatMap(x=>x.itens)
 .filter(x=>x.grupo==="PLACAS").reduce((s,x)=>s+x.qtd,0);
 return `<div class="card"><h2>Relatórios gerais</h2>
 <div class="grid">
 <div class="resumo">Total comprado<h2>${dinheiro(compras)}</h2></div>
 <div class="resumo">Total vendido<h2>${dinheiro(vendas)}</h2></div>
 <div class="resumo">Placas compradas<h2>${numero(placas)} kg</h2></div>
 <div class="resumo">Ordens de serviço<h2>${db.ordens.length}</h2></div>
 </div>
 <h3>Histórico de movimentações</h3>
 <div class="tabela"><table>
 <tr><th>Data</th><th>Tipo</th><th>Cliente</th><th>Responsável</th><th>Total</th><th>Nota</th></tr>
 ${[
 ...db.compras.map(x=>({...x,tipo:"COMPRA"})),
 ...db.vendas.map(x=>({...x,tipo:"VENDA"}))
 ].sort((a,b)=>b.data.localeCompare(a.data)).map(x=>`<tr>
 <td>${new Date(x.data).toLocaleDateString("pt-BR")}</td>
 <td>${x.tipo}</td><td>${nomeCliente(x.cliente)}</td>
 <td>${esc(x.responsavel)}</td><td>${dinheiro(x.total)}</td>
 <td><button class="azul" onclick="imprimirNota('${x.tipo}','${x.id}')">PDF</button></td>
 </tr>`).join("")}</table></div></div>`;
}
function financeiro(){
 if(db.usuario!=="Diego"){
 return `<div class="card"><h2>Financeiro</h2>
 <p>Área reservada ao administrador.</p>
 <p><small>Este bloqueio é apenas visual. Controle seguro exige autenticação no servidor.</small></p></div>`;
 }
 const compras=db.compras.reduce((s,x)=>s+x.total,0);
 const vendas=db.vendas.reduce((s,x)=>s+x.total,0);
 return `<div class="card"><h2>Financeiro administrativo</h2>
 <div class="grid">
 <div class="resumo"><b>Compras</b><h2>${dinheiro(compras)}</h2></div>
 <div class="resumo"><b>Vendas</b><h2>${dinheiro(vendas)}</h2></div>
 <div class="resumo"><b>Diferença bruta</b><h2>${dinheiro(vendas-compras)}</h2></div>
 </div>
 <p><small>A diferença bruta não representa lucro líquido: faltam despesas, custos, impostos e ajustes de estoque.</small></p>
 </div>`;
}
function imprimirNota(tipo,registroId){
 const lista=tipo==="COMPRA"?db.compras:db.vendas;
 const r=lista.find(x=>x.id===registroId);
 if(!r)return;
 const c=db.clientes.find(x=>x.id===r.cliente);
 const linhas=r.itens.map(x=>`<tr><td>${esc(x.nome)}</td>
 <td>${numero(x.qtd)} ${esc(x.un)}</td>
 <td>${dinheiro(x.valor)}</td>
 <td>${dinheiro(x.qtd*x.valor)}</td></tr>`).join("");
 const soma=(grupo)=>numero(r.itens.filter(x=>x.grupo===grupo).reduce((s,x)=>s+x.qtd,0));
 const unidades=numero(r.itens.filter(x=>x.un==="UN").reduce((s,x)=>s+x.qtd,0));
 imprimirDocumento(`Nota de ${tipo}`,
 `<p><b>Cliente:</b> ${nomeCliente(r.cliente)}</p>
 <p><b>Data:</b> ${new Date(r.data).toLocaleString("pt-BR")}</p>
 <p><b>Responsável:</b> ${esc(r.responsavel)}</p>
 <p><b>PIX do cliente:</b> ${esc(c?.pix||"Não informado")}</p>
 <table><tr><th>Material</th><th>Quantidade</th><th>Preço</th><th>Total</th></tr>${linhas}</table>
 <h2>Total: ${dinheiro(r.total)}</h2>
 <p><b>Placas:</b> ${soma("PLACAS")} kg</p>
 <p><b>Alumínio:</b> ${soma("ALUMINIO")} kg</p>
 <p><b>Cobre:</b> ${soma("COBRE")} kg</p>
 <p><b>Unidades:</b> ${unidades}</p>
 <p><b>Observações:</b> ${esc(r.obs)}</p>`);
}
function imprimirDocumento(titulo,conteudo){
 const w=window.open("","_blank");
 if(!w)return alert("Permita janelas pop-up para imprimir.");
 w.document.write(`<!DOCTYPE html><html lang="pt-BR"><head>
 <meta charset="UTF-8"><title>${titulo}</title>
 <style>body{font-family:Arial;padding:25px;color:#222}
 h1{color:#087747;font-size:23px}table{width:100%;border-collapse:collapse}
 td,th{border:1px solid #ccc;padding:8px;text-align:left}
 th{background:#e8f5ee}p{line-height:1.5}</style></head><body>
 <h1>THECNO ECO AMBIENTAL</h1><h2>${titulo}</h2>
 ${conteudo}<hr><small>Documento gerado pelo sistema de gestão.</small>
 </body></html>`);
 w.document.close();
 w.focus();
 setTimeout(()=>w.print(),400);
}
render();
</script>
